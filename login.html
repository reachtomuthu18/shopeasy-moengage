<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Login / Register</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://cdn.moengage.com/" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.moengage.com/" />
    <link rel="preconnect" href="https://sdk-01.moengage.com/" crossorigin />
    <link rel="dns-prefetch" href="https://sdk-01.moengage.com/" />

    <script type="text/javascript">
        var moeDataCenter = "dc_1";
        var moeAppID = "2877NHMD0TOHATHC6NNHDERW";
        !function(e,n,i,t,a,r,o,d){if(!moeDataCenter||!moeDataCenter.match(/^dc_[0-9]+$/gm))return console.error("Data center has not been passed correctly. Please follow the SDK installation instruction carefully.");var s=e[a]=e[a]||[];if(s.invoked=0,s.initialised>0||s.invoked>0)return console.error("MoEngage Web SDK initialised multiple times. Please integrate the Web SDK only once!"),!1;e.moengage_object=a;var l={},g=function n(i){return function(){for(var n=arguments.length,t=Array(n),a=0;a<n;a++)t[a]=arguments[a];(e.moengage_q=e.moengage_q||[]).push({f:i,a:t})}},u=["track_event","add_user_attribute","add_first_name","add_last_name","add_email","add_mobile","add_user_name","add_gender","add_birthday","destroy_session","add_unique_user_id","update_unique_user_id","moe_events","call_web_push","track","location_type_attribute","identifyUser","getUserIdentities"],m={onsite:["getData","registerCallback","getSelfHandledOSM"]};for(var c in u)l[u[c]]=g(u[c]);for(var v in m)for(var f in m[v])null==l[v]&&(l[v]={}),l[v][m[v][f]]=g(v+"."+m[v][f]);r=n.createElement(i),o=n.getElementsByTagName("head")[0],r.async=1,r.src=t,o.appendChild(r),e.moe=e.moe||function(){return(s.invoked=s.invoked+1,s.invoked>1)?(console.error("MoEngage Web SDK initialised multiple times. Please integrate the Web SDK only once!"),!1):(d=arguments.length<=0?void 0:arguments[0],l)},r.addEventListener("load",function(){if(d)return e[a]=e.moe(d),e[a].initialised=e[a].initialised+1||1,!0}),r.addEventListener("error",function(){return console.error("Moengage Web SDK loading failed."),!1})}(window,document,"script","https://cdn.moengage.com/release/" + moeDataCenter + "/moe_webSdk.min.latest.js","Moengage");

        Moengage = moe({
            "app_id": moeAppID,
            "env": "LIVE",
            "logLevel": 1,
            "swPath": "/js/serviceworker.js"
        });
    </script>
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">

            <!-- LOGO -->
            <div class="auth-logo">Shop<span>Easy</span> 🛍️</div>

            <!-- TABS -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">
                    Login
                </button>
                <button class="auth-tab" id="registerTab" onclick="switchTab('register')">
                    Register
                </button>
            </div>

            <!-- LOGIN FORM -->
            <div class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input 
                        type="email" 
                        id="loginEmail" 
                        placeholder="Enter your email"
                    >
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Enter your password"
                    >
                </div>
                <button class="form-submit-btn" onclick="handleLogin()">
                    Login →
                </button>
                <div class="auth-message" id="loginMessage"></div>
            </div>

            <!-- REGISTER FORM -->
            <div class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input 
                        type="text" 
                        id="regName" 
                        placeholder="Enter your full name"
                    >
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input 
                        type="email" 
                        id="regEmail" 
                        placeholder="Enter your email"
                    >
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input 
                        type="tel" 
                        id="regMobile" 
                        placeholder="Enter your mobile number"
                    >
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input 
                        type="password" 
                        id="regPassword" 
                        placeholder="Create a password"
                    >
                </div>
                <button class="form-submit-btn" onclick="handleRegister()">
                    Create Account →
                </button>
                <div class="auth-message" id="registerMessage"></div>
            </div>

        </div>
    </div>

    <script src="js/auth.js"></script>

    <script>
        Moengage.track_event("Page Viewed", { page_name: "Login" });

        const user = JSON.parse(localStorage.getItem('loggedInUser'));
        if (user) {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
